version: "3"
services:
  meguca:
    build: .
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - images:/meguca/images
    depends_on:
      - postgres
    environment:
      - USE_S3_STORAGE=true
      - S3_BUCKET_NAME=geckochen-test-bucket
      - AWS_REGION=us-east-1
  postgres:
    build: docker/postgres
    shm_size: "256MB"
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=meguca
      - POSTGRES_PASSWORD=meguca
      - POSTGRES_DB=meguca
volumes:
  images:
  db:
